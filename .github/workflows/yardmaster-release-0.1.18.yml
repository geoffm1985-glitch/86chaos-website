name: Yardmaster 0.1.18 Release Verification
on:
  push:
    branches: [yardmaster-release-0.1.18]
permissions:
  contents: write
jobs:
  verify-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install website dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate and verify Yardmaster release package
        run: npm run test:yardmaster
      - name: Build website
        run: npm run build
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/yardmaster-preview.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4321/yardmaster >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/yardmaster-preview.log
          exit 1
      - name: Android Chrome + iPhone Safari runtime gate
        env:
          YARDMASTER_PWA_BASE: http://127.0.0.1:4321
        run: node tests/yardmaster-mobile.runtime.mjs
      - name: Commit generated verified release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/yardmaster/release.json public/yardmaster/releases/Yardmaster-Windows-0.1.18.zip
          if git diff --cached --quiet; then
            echo "Generated release files already current."
            exit 0
          fi
          git commit -m "Publish generated verified Yardmaster 0.1.18 package"
          git push origin HEAD:yardmaster-release-0.1.18
