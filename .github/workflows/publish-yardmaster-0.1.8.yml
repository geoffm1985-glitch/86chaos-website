name: Publish Yardmaster 0.1.8
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified Yardmaster artifact
        env:
          ARTIFACT_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-0b28-81f6-b7b7-cb443b983b03/raw?se=2026-09-28T08%3A43%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=e95f30e7-650d-5be4-ad98-273a14fda621&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A57%3A55Z&ske=2026-09-28T23%3A57%3A55Z&sks=b&skv=2026-02-06&sig=C0YZQcb5PUCuSvFh3PvoioNyPiuPRs7Dh7v9fzihorU%3D"
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/yardmaster-artifact.zip
          python - <<'PY'
          import zipfile, pathlib, hashlib
          outer=zipfile.ZipFile('/tmp/yardmaster-artifact.zip')
          name='Yardmaster-Windows-0.1.8.zip'
          data=outer.read(name)
          out=pathlib.Path('public/yardmaster/releases')/name
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          sha=hashlib.sha256(data).hexdigest()
          expected='8f1ef244e4dab3f76c35d745ab9306faa70ec21ca14acdec13c8b67bead87fd7'
          if sha != expected:
              raise SystemExit(f'checksum mismatch: {sha}')
          print('verified',name,len(data),sha)
          PY
      - name: Update Yardmaster website release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const releasePath='public/yardmaster/release.json';
          const release={
            product:'Yardmaster',
            version:'0.1.8',
            releaseDate:'2026-09-28',
            verified:true,
            verification:{
              pcTargeted:'pass',
              mobileRemoteTargeted:'pass',
              installerUpdate:'pass',
              chatgptHandoff:'pass',
              newWorkAutomation:'pass',
              liveCloudflareRemote:'pass'
            },
            downloadUrl:'/yardmaster/releases/Yardmaster-Windows-0.1.8.zip',
            sha256:'8f1ef244e4dab3f76c35d745ab9306faa70ec21ca14acdec13c8b67bead87fd7'
          };
          fs.writeFileSync(releasePath,JSON.stringify(release,null,2)+'\n');

          const pagePath='src/pages/yardmaster.astro';
          let page=fs.readFileSync(pagePath,'utf8');
          page=page.replace(/Verified Yardmaster 0\.1\.7/g,'Verified Yardmaster 0.1.8');
          fs.writeFileSync(pagePath,page);

          const vercelPath='vercel.json';
          let v=fs.readFileSync(vercelPath,'utf8');
          v=v.replaceAll('Yardmaster-Windows-0.1.7.zip','Yardmaster-Windows-0.1.8.zip');
          fs.writeFileSync(vercelPath,v);
          NODE
      - name: Targeted website verification
        run: |
          npm ci --no-audit --no-fund
          npm run test:yardmaster
          npx astro build
      - name: Publish verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-yardmaster-0.1.8.yml
          git add public/yardmaster/releases/Yardmaster-Windows-0.1.8.zip public/yardmaster/release.json public/yardmaster/sw.js src/pages/yardmaster.astro vercel.json
          git commit -m "Publish verified Yardmaster 0.1.8"
          git push origin HEAD:main
