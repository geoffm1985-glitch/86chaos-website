name: Publish Yardmaster 0.1.10
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified Yardmaster artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-cee0-81f5-95f1-3bd0f8477e38/raw?se=2026-09-28T09%3A15%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=b789ec97-cd0c-57ed-a586-d98c93586e91&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A44%3A32Z&ske=2026-09-28T23%3A44%3A32Z&sks=b&skv=2026-02-06&sig=bXA/bM57BMyEIFZhYbMsD76abxz1u/xKwi1nJ0rPJRA%3D"
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/yardmaster-artifact.zip
          python - <<'PY'
          import zipfile, pathlib, hashlib
          outer=zipfile.ZipFile('/tmp/yardmaster-artifact.zip')
          name='Yardmaster-Windows-0.1.10.zip'
          data=outer.read(name)
          out=pathlib.Path('public/yardmaster/releases')/name
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          sha=hashlib.sha256(data).hexdigest()
          expected='434165c1e975cb67b03015d0f647b8086fec7dab786b248664aef79a25a097f9'
          if sha != expected: raise SystemExit(f'checksum mismatch: {sha}')
          print('verified',name,len(data),sha)
          PY
      - name: Update Yardmaster release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('public/yardmaster/release.json',JSON.stringify({
            product:'Yardmaster',
            version:'0.1.10',
            releaseDate:'2026-09-28',
            verified:true,
            verification:{
              pcTargeted:'pass',
              mobileRemoteTargeted:'pass',
              installerUpdate:'pass',
              chatgptHandoff:'pass',
              newWorkAutomation:'pass',
              liveCloudflareRemote:'pass',
              mobileAuthFailClosed:'pass',
              qrTunnelAndCodeHandoff:'pass'
            },
            downloadUrl:'/yardmaster/releases/Yardmaster-Windows-0.1.10.zip',
            sha256:'434165c1e975cb67b03015d0f647b8086fec7dab786b248664aef79a25a097f9'
          },null,2)+'\n');
          let page=fs.readFileSync('src/pages/yardmaster.astro','utf8');
          page=page.replace(/Verified Yardmaster 0\.1\.9/g,'Verified Yardmaster 0.1.10');
          fs.writeFileSync('src/pages/yardmaster.astro',page);
          let sw=fs.readFileSync('public/yardmaster/sw.js','utf8');
          sw=sw.replace(/yardmaster-pwa-v0\.1\.9/g,'yardmaster-pwa-v0.1.10');
          fs.writeFileSync('public/yardmaster/sw.js',sw);
          let v=fs.readFileSync('vercel.json','utf8');
          v=v.replaceAll('Yardmaster-Windows-0.1.9.zip','Yardmaster-Windows-0.1.10.zip');
          fs.writeFileSync('vercel.json',v);
          NODE
      - name: Targeted website verification
        run: |
          npm ci --no-audit --no-fund
          npm run test:yardmaster
          npx astro build
      - name: Publish verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-yardmaster-0.1.10.yml
          git add public/yardmaster/releases/Yardmaster-Windows-0.1.10.zip public/yardmaster/release.json public/yardmaster/sw.js src/pages/yardmaster.astro scripts/verify-yardmaster-release.mjs vercel.json
          git commit -m "Publish verified Yardmaster 0.1.10"
          git push origin HEAD:main
